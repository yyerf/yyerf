name: Update personal age

on:
  workflow_dispatch:
  schedule:
    # The displayed age is date-based, so it changes at Philippine midnight.
    # The second run is a catch-up in case GitHub delays or drops the first one.
    - cron: "7 0 * * *"
      timezone: "Asia/Manila"
    - cron: "37 0 * * *"
      timezone: "Asia/Manila"

permissions:
  contents: write

# Serialize all jobs that write dark_mode.svg and light_mode.svg.
concurrency:
  group: profile-card-writer
  cancel-in-progress: false

jobs:
  update-age:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Recalculate age without calling the GitHub API
        run: python generate_profile.py --offline

      - name: Commit the updated card only when the age changed
        shell: bash
        run: |
          if git diff --quiet -- dark_mode.svg light_mode.svg README.md; then
            echo "Personal age is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg README.md
          git commit -m "chore: refresh personal age"
          git push
