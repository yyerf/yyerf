  <text xml:space="preserve">
    <tspan x="520" y="31">fr3yy@yyerf</tspan><tspan class="rule"> ------------------------------------------------------------</tspan><tspan class="muted" x="520" y="55">. </tspan><tspan class="key">OS</tspan><tspan>: </tspan><tspan class="muted">......................... </tspan><tspan class="value">Pop!_OS, Raspberry Pi OS, Windows Server</tspan><tspan class="muted" x="520" y="78">. </tspan><tspan class="key">Uptime</tspan><tspan>: </tspan><tspan class="muted">.................................. </tspan><tspan class="value">21 years, 11 months, 9 days</tspan><tspan class="muted" x="520" y="101">. </tspan><tspan class="key">Host</tspan><tspan>: </tspan><tspan class="muted">................................. </tspan><tspan class="value">Student Developer &amp; Freelancer</tspan><tspan class="muted" x="520" y="124">. </tspan><tspan class="key">Kernel</tspan><tspan>: </tspan><tspan class="muted">........................... </tspan><tspan class="value">Computer Vision + Embedded Systems</tspan><tspan class="muted" x="520" y="147">. </tspan><tspan class="key">IDE</tspan><tspan>: </tspan><tspan class="muted">......................................... </tspan><tspan class="value">VS Code, Codex CLI, Git</tspan><tspan class="muted" x="520" y="193">. </tspan><tspan class="key">Languages.Programming</tspan><tspan>: </tspan><tspan class="muted">............. </tspan><tspan class="value">Python, Java, JavaScript, Flutter</tspan><tspan class="muted" x="520" y="216">. </tspan><tspan class="key">Languages.Computer</tspan><tspan>: </tspan><tspan class="muted">...................... </tspan><tspan class="value">HTML, CSS, JSON, YAML, Bash</tspan><tspan class="muted" x="520" y="239">. </tspan><tspan class="key">Languages.Real</tspan><tspan>: </tspan><tspan class="muted">.................................... </tspan><tspan class="value">English, Filipino</tspan><tspan class="muted" x="520" y="285">. </tspan><tspan class="key">Focus.Software</tspan><tspan>: </tspan><tspan class="muted">................. </tspan><tspan class="value">Web Apps, ServerAdmin, DevOps, CI/CD</tspan><tspan class="muted" x="520" y="308">. </tspan><tspan class="key">Focus.Hardware</tspan><tspan>: </tspan><tspan class="muted">........ </tspan><tspan class="value">Hardware Hacking, RFID, Raspberry Pi, Arduino</tspan><tspan x="520" y="354">- Contact</tspan><tspan class="rule"> --------------------------------------------------------------</tspan><tspan class="muted" x="520" y="377">. </tspan><tspan class="key">GitHub</tspan><tspan>: </tspan><tspan class="muted">....................................................... </tspan><tspan class="value">@yyerf</tspan><tspan class="muted" x="520" y="400">. </tspan><tspan class="key">Location</tspan><tspan>: </tspan><tspan class="muted">................................................ </tspan><tspan class="value">Philippines</tspan><tspan x="520" y="446">- GitHub Stats</tspan><tspan class="rule"> ---------------------------------------------------------</tspan><tspan class="muted" x="520" y="469">. </tspan><tspan class="key">Repos</tspan><tspan>: </tspan><tspan class="muted">.... </tspan><tspan class="value">44</tspan><tspan> {</tspan><tspan class="key">Contributed</tspan><tspan>: </tspan><tspan class="value">67</tspan><tspan>} | </tspan><tspan class="key">Stars</tspan><tspan>: </tspan><tspan class="muted">.......................... </tspan><tspan class="value">1</tspan><tspan class="muted" x="520" y="492">. </tspan><tspan class="key">Commits</tspan><tspan>: </tspan><tspan class="muted">......................... </tspan><tspan class="value">309</tspan><tspan> | </tspan><tspan class="key">Followers</tspan><tspan>: </tspan><tspan class="muted">............... </tspan><tspan class="value">11</tspan><tspan class="muted" x="520" y="515">. </tspan><tspan class="key">Lines of Code on GitHub</tspan><tspan>: </tspan><tspan class="muted">...... </tspan><tspan class="value">2,483,280</tspan><tspan> ( </tspan><tspan class="addition">4,588,893</tspan><tspan class="addition">++</tspan><tspan>, </tspan><tspan class="deletion">2,105,613</tspan><tspan class="deletion">--</tspan><tspan> )</tspan><tspan x="520" y="550">- Favorite Quote</tspan><tspan class="rule"> -------------------------------------------------------</tspan><tspan class="value" x="534" y="580">“My advantage isn’t knowing every answer—it’s knowing how to find one.”</tspan>
